name: Master Enriched Daily Update

# Scheduled: runs every day at 07:00 IST (01:30 UTC) — 30 minutes after
#            the DOD Daily Update job (06:30 IST), so this run's recurring-
#            campaign exclusion check (see find_recurring_campaign_ids in
#            src/loader.py) sees dod_daily's freshest possible state.
#            Pulls the last 14 days every run, re-checking each campaign
#            repeatedly until it ages out of that window; safe because
#            upsert_master_enriched dedupes by Campaign_ID+Variation, and
#            (as of 2026-10-02) specifically takes the MAX primary_conversions
#            seen across any duplicate rows rather than blindly trusting
#            whichever pull is "newest" - conversions only ever accumulate
#            forward, so a re-pull can never legitimately lower one.
#
#            Widened from 3 days on 2026-10-02: a 3-day window isn't enough
#            time for MoEngage to finish attributing conversions before a
#            campaign ages out of the pull entirely and is never re-checked
#            again - every day from 2026-08-29 (when this pipeline first
#            took over from manually-exported CSVs, which had weeks to
#            mature by the time they were pulled) showed conversions
#            collapse to ~0 as a direct result. 14 days gives real goal
#            completions (a UPI transaction, a credit card application,
#            etc.) meaningfully more time to land before that campaign's
#            last chance to be re-measured.
# Manual:    trigger from GitHub UI with a custom day count to backfill a
#            gap (e.g. after this automation was paused, or to recover
#            from a missed run)
#
# To backfill a larger gap (e.g. 45 days):
#   GitHub → Actions → Master Enriched Daily Update → Run workflow
#   days: 45

on:
  schedule:
    - cron: '30 1 * * *'   # UTC 01:30 daily = IST 07:00 daily
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to pull from API (leave blank for default 14)'
        required: false
        default: ''

jobs:
  update-master-enriched:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP service account credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_CLOUD_KEY_JSON }}' > credentials/service_account.json

      - name: Run master_enriched update
        env:
          MOENGAGE_APP_ID: ${{ secrets.MOENGAGE_APP_ID }}
          MOENGAGE_SECRET_KEY: ${{ secrets.MOENGAGE_SECRET_KEY }}
          MOENGAGE_DATA_CENTER: api-03
          GCP_PROJECT_ID: copies-qc
          GOOGLE_CLOUD_KEY_PATH: credentials/service_account.json
          BQ_DATASET: pn_report
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=14; fi
          echo "Pulling last $DAYS days into master_enriched"
          python run_report.py --api --days "$DAYS" --target master_enriched

      - name: Clean up credentials
        if: always()
        run: rm -f credentials/service_account.json
